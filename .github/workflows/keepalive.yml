name: Cloud Keep-Alive Cron

on:
  workflow_dispatch: # Allow manual trigger from GitHub web UI
  # To enable automatic 24/7 pings, uncomment the schedule below after adding APP_URLS secret:
  # schedule:
  #   - cron: '*/12 * * * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ping Keep-Alive Endpoints
        env:
          APP_URLS: ${{ secrets.APP_URLS }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 keepalive.py
